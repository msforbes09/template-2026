# Reference nginx config for this app on the staging EC2 host — NOT used
# by Docker (the app publishes its port on 127.0.0.1 only, see
# docker-compose.yml). This host-level nginx is the sole reverse proxy in
# front of the app, so it's the only place the buffering-disable below
# needs to be set.
#
# This is a complete, droppable server block:
#   - Debian/Ubuntu: save as /etc/nginx/sites-available/egov-api-ui.conf,
#     then `ln -s` it into sites-enabled/
#   - Amazon Linux/RHEL: save as /etc/nginx/conf.d/egov-api-ui.conf
# If EC2 already has a server block for this domain, merge just the
# `location /` block (and the `map` block, into the http {} scope if not
# already present) into that instead of adding a second server block for
# the same server_name.

# Only sets "Connection: upgrade" when the client actually sent an
# Upgrade header — otherwise nginx would force every keep-alive
# connection closed. Belongs in the http {} scope, once per nginx.conf
# (not per server block) — if EC2's nginx.conf already has one, don't
# duplicate it here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Hard floor under /api/chat, the one unauthenticated endpoint that spends
# money: each accepted user turn runs a billed Vertex generation of up to
# MAX_STEPS round-trips. The app has its own limiter (modules/assistant/lib/
# rate-limit.ts) but it is in-memory and therefore per-process, so it cannot
# bound spend across a restart or a second instance. $binary_remote_addr is the
# TCP peer — unlike any request header, a client cannot choose it.
#
# Belongs in the http {} scope, once per nginx.conf. If EC2's nginx.conf
# already defines a zone of this name, don't duplicate it here.
limit_req_zone $binary_remote_addr zone=egov_chat:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;

    # <-- UPDATE THIS to the real staging domain.
    server_name staging.example.com;

    # The backend API caps uploads at 5MB; this stays above the app's own
    # 6mb Server Action body limit (next.config.ts) so nginx never rejects
    # a legitimate upload before Next.js does — Next.js stays the actual
    # enforcement point, with a proper in-app error instead of a generic
    # nginx 413 page.
    client_max_body_size 8m;

    # Uncomment if this nginx terminates TLS itself (skip this whole
    # block if a load balancer/ALB in front of EC2 already handles TLS
    # and forwards plain HTTP here):
    #
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/staging.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/staging.example.com/privkey.pem;
    #
    # and add a second, plain `server { listen 80; server_name ...;
    # return 301 https://$host$request_uri; }` block to redirect http -> https.

    # The assistant endpoint, rate-limited before it reaches the app. burst=10
    # with nodelay absorbs the tool round-trips one user turn legitimately
    # produces (the client auto-resubmits after each client-side tool result)
    # without letting a sustained flood through. 429 matches what the app's own
    # limiter returns, so the widget handles both identically.
    location = /api/chat {
        limit_req zone=egov_chat burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";

        # The chat response is a stream — buffering it would defeat the point.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        # Port must match PORT in the app's .env (default 3000).
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Clear any CF-Connecting-IP the CLIENT sent. There is no Cloudflare in
        # this topology, so nothing legitimate sets it — but lib/client-ip.ts
        # used to prefer it, which made the IP recorded against every
        # authenticated backend call (credential generation, project
        # publication, logout) a value the caller chose. That preference is
        # gone; this stops the header reaching the app at all, so the two
        # halves cannot drift back apart. If Cloudflare is ever put in front,
        # set this from the real upstream rather than deleting the line.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Required for Partial Prerendering/streaming — buffering here
        # would deliver the static shell and streamed dynamic content
        # together only after the full render completes, eliminating
        # PPR's time-to-first-byte benefit (see the Next.js self-hosting
        # docs, "Streaming and Suspense").
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

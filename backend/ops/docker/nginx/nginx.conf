user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  'site="$server_name" server="$host" dest_port="$server_port" dest_ip="$server_addr" '
              'src="$remote_addr" src_ip="$realip_remote_addr" user="$remote_user" time_local="[$time_local]" '
              'http_request="$request" uri_path="$uri" uri_query="$query_string" '
                      'status="$status" bytes_out="$body_bytes_sent" '
                      'bytes_in="$upstream_response_length" http_referer="$http_referer" '
              'http_user_agent="$http_user_agent" http_x_forwarded_for="$http_x_forwarded_for" '
              'response_time="$upstream_response_time" cookie="$http_cookie" request_time="$request_time" '
              'nginx_version="$nginx_version" ';

    #access_log  /var/log/nginx/access.log  main;
    
    access_log off;

    sendfile     on;
    tcp_nodelay  on;

    client_body_buffer_size 10k;
    client_max_body_size 12m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 32k;

    client_body_timeout 12;
    client_header_timeout 12;

    keepalive_timeout 30; 
    keepalive_requests 100;
    send_timeout 2;

    # Real-IP trust list: the header and ranges below assume Cloudflare in front of an
    # AWS load balancer. Replace with your own CDN/proxy ranges if your edge differs.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    # The immediate peer is never Cloudflare: traffic arrives via the AWS load
    # balancer (VPC 10.x) and Docker NAT (172.x bridge), and real_ip only
    # rewrites when the *peer* is trusted. Trust those internal hops too, or the
    # CF-Connecting-IP header is ignored and $remote_addr is the Docker gateway.
    # Keep in sync with project/app/Http/TrustedProxies.php (Laravel's side).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    # Cloudflare's published proxy ranges — https://www.cloudflare.com/ips/
    # IPv4
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    gzip on;
    gzip_comp_level 2;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json text/javascript application/x-javascript application/xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    include /etc/nginx/conf.d/*.conf;
}

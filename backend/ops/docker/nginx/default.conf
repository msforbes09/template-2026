upstream fcgi_backend {
  server app:9000;
  keepalive 32;
}

upstream reverb_backend {
  server app:8080;
}

server {
    listen  80 default_server;
    listen [::]:80 default_server;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 12M;
    sendfile off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";
    add_header X-Content-Type-Options "nosniff";
    add_header Feature-Policy "geolocation 'self'; camera 'none'; microphone 'none'";
    add_header Referrer-Policy "same-origin";
    large_client_header_buffers 4 32k;
    
    # Config
    #add_header Content-Security-Policy "default-src 'self'";

    # --- Performance: Gzip Compression ---
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # The Horizon dashboard is served only by the dedicated listener below.
    location ^~ /horizon {
        return 404;
    }

    location / {
        gzip_static on;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverb WebSocket (Pusher protocol path) — upgrade + proxy to the reverb server.
    location /app {
        proxy_pass http://reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # location /api/query {
    #     proxy_read_timeout 300;
    #     proxy_connect_timeout 300;
    #     proxy_send_timeout 300; 
    #     gzip_static on;
    #     try_files $uri $uri/ /index.php?$query_string;
    # }

    location ~ \.php$ {
        fastcgi_keep_conn on;
        fastcgi_pass fcgi_backend;
        include fastcgi_params;
        # real_ip_header (CF-Connecting-IP) rewrites $remote_addr to the resolved
        # client, so pin REMOTE_ADDR to the ORIGINAL peer instead — otherwise PHP
        # would trust the client as its immediate proxy and honour a forged
        # X-Forwarded-For prefix. Keep in sync with App\Http\TrustedProxies.
        fastcgi_param REMOTE_ADDR $realip_remote_addr;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;

        # --- Performance: FastCGI Tuning ---
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        fastcgi_intercept_errors on;
    }
}

# Horizon dashboard — its own listener so it can be routed to a separate
# subdomain and never shares the API's public port. Only the /horizon paths
# (dashboard, its JSON API, and the signed /horizon-access handoff) reach PHP.
server {
    listen  8081;
    listen [::]:8081;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "same-origin";

    location ^~ /horizon {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        return 404;
    }

    location ~ \.php$ {
        fastcgi_keep_conn on;
        fastcgi_pass fcgi_backend;
        include fastcgi_params;
        fastcgi_param REMOTE_ADDR $realip_remote_addr;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_intercept_errors on;
    }
}
